# DeepSeek Harness profile bundle: dsh-models-plus
# 1. Disables the shipped Models settings UI row.
# 2. Replaces the shipped llm-pi-ai host adapter with this package,
#    which provides the loopback local route (configurable port, default 8317) AND
#    registers the customized Models settings UI into the browser graph.

- id: ui-settings-models
  disabled: true

- id: llm-pi-ai
  disabled: true

- insert:
    - id: llm-pi-ai-local-route
      name: dsh-models-plus
